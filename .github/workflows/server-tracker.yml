# DutyMapper server tracker: checks the servers dutymapper.com follows and redraws their banners.
# See server-tracker/README.md. dutymapper.com accepts reports only from THIS file on master, which it
# checks with the token GitHub signs for every run (no passwords or secrets anywhere).
name: DutyMapper server tracker

on:
  # GitHub runs schedules hours late when it's busy (2026-10-16: about every 4 hours), so each run
  # starts the next one itself (the last step). The schedule only restarts that chain if it stops.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write    # each run starts the next one
  contents: write   # only for the keep-alive commit
  id-token: write   # the signed token dutymapper.com checks

concurrency:
  group: server-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        timeout-minutes: 3
        with:
          python-version: "3.12"

      - name: Pillow, and the website's fonts (Google Fonts' repo, pinned commit)
        timeout-minutes: 3
        run: |
          pip install --quiet "pillow==11.3.0"
          mkdir -p fonts
          base="https://raw.githubusercontent.com/google/fonts/1d0e46c7933245c8180fe83e47917961c913bbdb/ofl"
          curl -fsSL -o fonts/BigShouldersDisplay.ttf "$base/bigshouldersdisplay/BigShouldersDisplay%5Bwght%5D.ttf"
          curl -fsSL -o fonts/Barlow-SemiBold.ttf "$base/barlow/Barlow-SemiBold.ttf"
          curl -fsSL -o fonts/JetBrainsMono.ttf "$base/jetbrainsmono/JetBrainsMono%5Bwght%5D.ttf"

      - name: Check the servers and send the reports
        timeout-minutes: 7   # 4 checks a minute apart, then the banners
        working-directory: server-tracker
        env:
          FONTS_DIR: ${{ github.workspace }}/fonts
        run: python tracker.py

      # GitHub switches off scheduled workflows in repos with no commits for 60 days, and a switched-off
      # workflow can't start the next check either. One small commit every 50 days keeps it running.
      - name: Keep the tracker alive
        if: github.ref == 'refs/heads/master'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( ($(date +%s) - last) / 86400 )) -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u +%F > server-tracker/keepalive.txt
            git add server-tracker/keepalive.txt
            git commit -m "Keep the server tracker's schedule running"
            git push
          fi

      # Start the next check, even after a failure -- always. GitHub keeps at most one run waiting in
      # the concurrency group (a newer one replaces an older waiting one), so there is never a second
      # chain. (Skipping when "a run is already waiting" broke the chain on 2026-10-19 and 10-21: the
      # run GitHub listed as waiting never ran, and checks stopped for 4 hours, until the schedule.)
      # Then make sure GitHub really queued the new run, and try again if not. After a failure, wait
      # first, so a broken check retries every 5 minutes rather than every few seconds. To stop the
      # tracker, disable this workflow in the Actions tab.
      - name: Start the next check
        if: always() && github.ref == 'refs/heads/master'
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ job.status == 'failure' }}
        run: |
          if [ "$FAILED" = "true" ]; then sleep 240; fi
          since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for try in 1 2 3 4; do
            if gh workflow run server-tracker.yml -R "$GITHUB_REPOSITORY" --ref master; then
              for look in 1 2 3; do
                sleep 10
                queued=$(gh run list -R "$GITHUB_REPOSITORY" --workflow server-tracker.yml --event workflow_dispatch \
                  --limit 5 --json databaseId,createdAt \
                  --jq "[.[] | select(.createdAt >= \"$since\" and .databaseId != $GITHUB_RUN_ID)] | length")
                if [ "${queued:-0}" -gt 0 ]; then echo "The next check is queued."; exit 0; fi
              done
              echo "GitHub took the request but no new run showed up; asking again."
            fi
            sleep 15
          done
          exit 1
